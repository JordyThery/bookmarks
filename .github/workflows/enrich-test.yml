# Manual test of the automatic "fill in missing details" step.
# Actions > Enrichment test > Run workflow. Results appear on the run's summary page.
# Nothing is changed in the repository.
name: Enrichment test

on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs to try, separated by spaces
        default: >-
          https://github.com/Mac-Nerd/patchomator
          https://support.apple.com/HT202944
          https://mrmacintosh.com/
          https://fleetdm.com/
          https://berlinmacadmins.github.io
      model:
        description: GitHub Models model id (empty = no AI, only GitHub and page details)
        default: openai/gpt-4o

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      - name: Try the URLs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
          URLS: ${{ inputs.urls }}
        run: python scripts/enrich.py --dry-run $URLS
